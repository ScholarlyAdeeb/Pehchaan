<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#141d2e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b6e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer glowing rim -->
  <path d="M 256 60 L 410 110 L 410 260 C 410 360 256 440 256 440 C 256 440 102 360 102 260 L 102 110 Z" 
        fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.4"/>

  <!-- Main Shield -->
  <path d="M 256 75 L 395 120 L 395 255 C 395 345 256 425 256 425 C 256 425 117 345 117 255 L 117 120 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Fingerprint / Biometric concentric arcs -->
  <path d="M 200 230 A 60 60 0 0 1 312 230" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <path d="M 215 250 A 45 45 0 0 1 297 250" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round"/>
  <path d="M 230 270 A 30 30 0 0 1 282 270" fill="none" stroke="#dbeafe" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="285" r="4" fill="#ffffff"/>

  <!-- Face Scanner Corners -->
  <path d="M 180 160 L 160 160 L 160 180" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 332 160 L 352 160 L 352 180" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 160 310 L 160 330 L 180 330" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 352 310 L 352 330 L 332 330" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

  <!-- Laser Scan Line -->
  <line x1="150" y1="245" x2="362" y2="245" stroke="#22c55e" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Text -->
  <text x="256" y="380" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PEHCHAAN</text>
  <text x="256" y="405" font-family="monospace" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="2">SIH-26188</text>
</svg>
